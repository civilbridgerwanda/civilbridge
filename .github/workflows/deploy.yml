name: Check & Deploy

# What this does
#   - Every push to main: build and sanity-check the code, then (once the
#     secrets below exist) deploy it to the DEV site.
#   - Production is never automatic. You start it yourself: Actions tab ->
#     "Check & Deploy" -> Run workflow -> target "prod" and type PROD.
#   - Put [skip deploy] in a commit message to push without deploying.
#
# The deploy itself is one SSH command to the server that runs only
# deploy/ci-entry.sh (see docs/DEPLOY_AUTOMATION.md). Until the repository
# secrets are added, the deploy step politely skips instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [dev, prod]
        default: dev
      confirm:
        description: "For prod only: type PROD to confirm"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'dev' }}
  cancel-in-progress: false

jobs:
  check:
    name: Build & sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: No secrets or uploads committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|^server/uploads/.+|\.pem$|id_rsa|id_ed25519' || true)
          if [ -n "$bad" ]; then echo "::error::Files that must never be committed:"; echo "$bad"; exit 1; fi

      - name: Server - install and syntax-check every file
        working-directory: server
        run: |
          npm ci
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Client - install and build
        working-directory: client
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip deploy]')
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'prod' && 'production' || 'development' }}
    env:
      EVENT: ${{ github.event_name }}
      INPUT_TARGET: ${{ inputs.target }}
      INPUT_CONFIRM: ${{ inputs.confirm }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Decide what to deploy
        id: plan
        run: |
          target=dev
          if [ "$EVENT" = "workflow_dispatch" ]; then target="$INPUT_TARGET"; fi
          case "$target" in dev|prod) ;; *) echo "::error::target must be dev or prod"; exit 1 ;; esac
          if [ "$target" = "prod" ] && [ "$INPUT_CONFIRM" != "PROD" ]; then
            echo "::error::To deploy to production, type PROD in the 'confirm' box when you run the workflow."
            exit 1
          fi
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::Deploy secrets are not set yet - the code passed its checks but nothing was deployed. See docs/DEPLOY_AUTOMATION.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        if: steps.plan.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          # The server's identity is pinned from a secret, never trusted on first use.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ${{ steps.plan.outputs.target }}
        if: steps.plan.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "${{ steps.plan.outputs.target }}"

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key

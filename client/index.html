<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivilBridge — Build Smarter. Build Better. Build in Rwanda.</title>
    <meta
      name="description"
      content="CivilBridge is the construction intelligence platform that helps you plan, estimate, and execute building projects in Rwanda with confidence."
    />
    <meta name="theme-color" content="#03204c" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />

    <!-- Type pairing: Sora (display/headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CivilBridge",
        "url": "https://civil-bridge.com",
        "logo": "https://civil-bridge.com/logo.png",
        "description": "Construction intelligence platform helping people plan, estimate, and execute building projects in Rwanda.",
        "areaServed": "RW"
      }
    </script>

    <!-- Google Search Console ownership verification.
         Get this value from Search Console > Settings > Ownership verification > HTML tag.
         Set VITE_GSC_VERIFICATION in client/.env (do NOT hardcode it here). -->
    <meta name="google-site-verification" content="%VITE_GSC_VERIFICATION%" />

    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        if (!i || i === "%VITE_GTM_ID%") return; // skip if not configured yet
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l !== "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "%VITE_GTM_ID%");
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=%VITE_GTM_ID%"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
